name: Dog-owner enquiry regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enquiry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:enquiry
      - run: npm run test:enquiry:prerender
      - run: npm run build
      - run: npm run lint
      - run: npm run check:boundary
      - run: npm run test:seo
